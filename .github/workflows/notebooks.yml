name: Convert Notebooks to Posts

on:
  push:
    branches: [main, master]
    paths:
      - '_notebooks/**/*.ipynb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install nbconvert jupyter

      - name: Convert notebooks
        run: python bin/convert_notebooks.py --fast

      - name: Commit generated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ assets/img/notebooks/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-convert notebooks to posts"
            git push
          fi
